aid: limbo
name: Limbo
description: Limbo is a direct-to-consumer digital weight-loss and metabolic-health program operated by
  Vitals in View, Inc., with subsidiaries in the UK (company no. 15047668) and Ireland (company no. 725671).
  Members wear a body-worn "energy sensor" that reads metabolic signals, and a companion app turns those
  readings into personalized, nudge-based guidance intended to change eating habits without calorie counting.
  The company is Seedcamp-backed, raised a seed round in September 2022, and is mid-rebrand from Limbo
  (limborevolution.com) to Viv (viv.co), with the marketing site now served from content.viv.co. Limbo
  publishes no public API, developer portal, SDK, or /.well-known/ discovery surface; this profile captures
  its identity and probed security posture only.
